<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tap Fruit — Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 560px; margin: 0 auto; }
    input, button, textarea { font: inherit; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; width: 100%; box-sizing: border-box; }
    button { background: #f97316; border: none; color: white; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    h1 { margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 24px; }
    label { display: block; font-size: 12px; text-transform: uppercase; margin-top: 16px; letter-spacing: 0.1em; color: #94a3b8; }
    .ok { color: #22c55e; margin-top: 16px; }
    .err { color: #ef4444; margin-top: 16px; }
    .box { background: #1e293b; padding: 16px; border-radius: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>🍎 Tap Fruit — Admin</h1>
  <p>Введи пароль (x-admin-password) или initData от админа.</p>

  <label>Пароль (проще)</label>
  <input id="password" type="password" placeholder="ADMIN_PASSWORD" />

  <label>initData (альтернатива)</label>
  <textarea id="initData" rows="2" placeholder="Вставь initData из TWA — опционально"></textarea>

  <label>@username игрока</label>
  <input id="username" placeholder="username без @" />

  <label>Дней подписки</label>
  <input id="days" type="number" value="10" />

  <button id="grant">🎁 Выдать подписку</button>
  <button id="whoami" style="background:#334155">Проверить права</button>

  <div id="msg"></div>

<script>
const $ = id => document.getElementById(id);

async function api(path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const pw = $('password').value.trim();
  const id = $('initData').value.trim();
  if (pw) headers['x-admin-password'] = pw;
  if (id) headers['x-init-data'] = id;

  const res = await fetch('/api/admin' + path, {
    method: body ? 'POST' : 'GET',
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.hint || res.status);
  return data;
}

$('whoami').onclick = async () => {
  try {
    const r = await api('/whoami');
    $('msg').innerHTML = `<div class="ok">✅ Права ОК. Метод: ${r.method}, tgId: ${r.tgId ?? '—'}</div>`;
  } catch (e) { $('msg').innerHTML = `<div class="err">${e.message}</div>`; }
};

$('grant').onclick = async () => {
  const username = $('username').value.trim();
  const days = Number($('days').value || 10);
  if (!username) { $('msg').innerHTML = '<div class="err">Введи username</div>'; return; }
  try {
    const r = await api('/grant-by-username', { username, days });
    $('msg').innerHTML = `
      <div class="box">
        <div class="ok">✅ Выдано!</div>
        <div>@${r.user.username} (tgId ${r.user.tgId})</div>
        <div>Подписка до: ${new Date(r.user.subscriptionUntil).toLocaleString('ru')}</div>
        <div>Дней: ${r.user.daysLeft}</div>
      </div>
    `;
  } catch (e) {
    $('msg').innerHTML = `<div class="err">${e.message}</div>`;
  }
};
</script>
</body>
</html>
